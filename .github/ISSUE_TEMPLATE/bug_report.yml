name: Bug report
description: Something in ModelGlance behaves differently than described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, base URLs, request bodies or full config dumps.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.2.3-alpha.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 24H2 / macOS 15.2 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it
      options:
        - The composer model button (this plugin)
        - The host's own /model dialog (not this plugin)
        - The plugin detail page
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include any console error. Screenshots help, but hide provider names if they are private.
    validations:
      required: true
  - type: textarea
    id: catalog
    attributes:
      label: Model catalog shape (optional)
      description: How many providers and models, and whether the affected model advertises reasoning efforts.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on DSH 0.2.3-alpha.2 or later
        - label: I have restarted DSH fully since installing or updating the plugin
        - label: I did not include credentials, base URLs or conversation content