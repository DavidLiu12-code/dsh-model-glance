<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="dsh-design" content="desktop">
<title>搜索无结果 · 无推理档位 · 深色 · ModelGlance</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="v2.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-brand"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 11l7-4M12 11v10M12 11L5 7"/></svg>DeepSeek<span>Harness</span></div>
    <div class="side-new"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>新会话</div>
    <div class="side-sec">工作区</div>
    <div class="side-row"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>ModelGlance</div>
    <div class="side-sess on">模型选择器设计<span class="time">刚刚</span></div>
    <div class="side-sess">插件接口排查<span class="time">昨天</span></div>
    <div class="side-sess">输入栏交互<span class="time">周一</span></div>
    <div class="side-account"><span class="avatar">我</span>我的账号</div>
  </aside>

  <main class="main">
    <header class="head">
      <span class="head-title">模型选择器设计</span>
      <span class="mode-pill">标准模式<svg class="i i-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
      <div class="head-right">
        <button class="ibtn" aria-label="分栏"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
        <button class="ibtn" aria-label="更多"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
    </header>

    <div class="conv">
      <div class="conv-inner">
        <div class="msg bot">
          <span class="who">AI</span>
          <div><p>GLM-4.5-Air 的适配器没有推理元数据，所以整个「推理强度」那一行不出现——不留一行灰掉的禁用控件。</p></div>
        </div>
        <div class="msg user">
          <div class="bubble">那输入栏上的档位小胶囊呢？</div>
        </div>
        <div class="msg bot">
          <span class="who">AI</span>
          <div><p>一起消失，只留模型名。搜索没有命中时，列表区给一句人话，不做「暂无数据」这种机器文案。</p></div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="composer">
        <div class="composer-input">再换个本地模型试试…</div>
        <div class="composer-bar">
          <div class="cbar-left">
            <button class="ibtn" aria-label="添加附件"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="ibtn" aria-label="引用"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9a3 3 0 1 0 0 6"/></svg></button>
          </div>
          <div class="cbar-right">
            <button class="trigger" aria-expanded="true" aria-haspopup="dialog">GLM-4.5-Air<svg class="i i-sm chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
            <button class="send" aria-label="发送"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          </div>
        </div>

        <!-- 紧凑弹窗 · 搜索无结果 + 无推理档位 -->
        <div class="popover pop-compact" role="dialog" aria-label="选择模型">
          <div class="mg-top">
            <div class="mg-search">
              <svg class="i i-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              <input value="llama 4" aria-label="搜索模型">
            </div>
            <div class="mg-chips">
              <button class="mg-chip on">全部</button>
              <button class="mg-chip">DeepSeek</button>
              <button class="mg-chip">智谱 GLM</button>
              <button class="mg-chip">Ollama</button>
            </div>
          </div>

          <div class="mg-list">
            <div class="mg-empty" role="status">
              <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              <div class="t">没有匹配「llama 4」的模型</div>
              <div class="s">换个短一点的词，或者点上面的提供商缩小范围</div>
            </div>
            <div class="mg-sep"></div>
            <button class="mg-more">展开全部模型<svg class="i i-sm" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
